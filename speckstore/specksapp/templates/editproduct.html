<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
            padding:30px;
        }

        .container{
            width:100%;
            max-width:700px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
            color:#444;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
        }

        input:focus,
        textarea:focus{
            outline:none;
            border-color:#667eea;
        }

        textarea{
            resize:none;
            height:100px;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#667eea;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#5648c0;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>✏ Edit Product</h2>

    <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ product.name }}">
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number" name="price" value="{{ product.price }}">
        </div>

        <div class="form-group">
            <label>Brand</label>
            <input type="text" name="brand" value="{{ product.brand }}">
        </div>

        <div class="form-group">
            <label>Size</label>
            <input type="text" name="size" value="{{ product.size }}">
        </div>

        <div class="form-group">
            <label>Material</label>
            <input type="text" name="material" value="{{ product.material }}">
        </div>

        <div class="form-group">
            <label>Neckline</label>
            <input type="text" name="neckline" value="{{ product.neckline }}">
        </div>

        <div class="form-group">
            <label>Sleeve Length</label>
            <input type="text" name="sleeve_length" value="{{ product.sleeve_length }}">
        </div>

        <div class="form-group">
            <label>Length</label>
            <input type="text" name="length" value="{{ product.length }}">
        </div>

        <div class="form-group">
            <label>Color</label>
            <input type="text" name="color" value="{{ product.color }}">
        </div>

        <div class="form-group">
            <label>Pattern</label>
            <input type="text" name="pattern" value="{{ product.pattern }}">
        </div>

        <div class="form-group">
            <label>Image</label>
            <input type="file" name="image">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description">{{ product.description }}</textarea>
        </div>

        <button type="submit" class="btn">
            Update Product
        </button>

    </form>

</div>

</body>
</html>
