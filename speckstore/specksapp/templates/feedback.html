<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Identical dark premium studio background layout */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1974&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Frosted Atelier Glass Card Container */
        .feedback-card {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Serif Title Typography */
        .feedback-card h1 {
            font-family: 'Playfair Display', serif;
            color: #222;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Dynamic description style */
        .feedback-card p {
            color: #555;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        /* Premium Form Labeling */
        label {
            display: block;
            color: #222;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* Form Textarea to match Registration Fields */
        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            border: 1px solid #ccc;
            outline: none;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #222;
            transition: all 0.3s ease;
        }

        /* Gold Focus Ring Integration */
        textarea:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        textarea::placeholder {
            color: #aaa;
        }

        /* High-Contrast Classic Button Layout changing to Rich Gold */
        .submit-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #d4af37;
            color: white;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* Responsive Breakpoints */
        @media(max-width: 600px) {
            .feedback-card {
                padding: 25px;
            }

            .feedback-card h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="feedback-card">

        <h1>Feedback</h1>

        <p>
            We'd love to hear your thoughts and suggestions.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Your Feedback</label>
                <textarea
                    name="feedback"
                    placeholder="Write your feedback here..."
                    required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Feedback
            </button>

        </form>

    </div>

</body>
</html>
