<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            /* Premium dress designing atelier background image */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1974&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        /* Product Card */
        .product-card {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px); /* Premium luxury glassmorphism */
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Image Section */
        .image-container {
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .product-card img:hover {
            transform: scale(1.04);
        }

        /* Content Section */
        .product-info {
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-info h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            margin-bottom: 5px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #d4af37; /* Signature Gold Accent */
            margin-bottom: 25px;
            font-weight: 600;
        }

        .detail {
            margin-bottom: 12px;
            font-size: 15px;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .detail strong {
            color: #ffffff;
            font-weight: 500;
            margin-right: 5px;
        }

        .price {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            margin: 20px 0;
            display: flex;
            align-items: center;
        }

        .description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Action Row Layout */
        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Buy Form Configuration */
        .buy-form {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-grow: 1;
        }

        .buy-form input {
            width: 75px;
            padding: 13px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            color: #111;
            font-weight: 600;
        }

        /* Buttons Styling */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 13px 28px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-cart {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            height: 48px;
        }

        .btn-cart:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-buy {
            background: #d4af37;
            color: #ffffff;
            flex-grow: 1;
            height: 48px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .btn-buy:hover {
            background: #ffffff;
            color: #111111;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.25);
        }

        .btn-feedback {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            margin-top: 5px;
        }

        .btn-feedback:hover {
            background: #ffffff;
            color: #111111;
            border-color: #ffffff;
        }

        /* Responsive Design Rules */
        @media(max-width:950px){
            .product-card {
                grid-template-columns: 1fr;
                max-width: 600px;
            }

            .product-card img {
                height: 400px;
            }

            .product-info {
                padding: 35px;
            }

            .product-info h1 {
                font-size: 2rem;
            }
        }

        @media(max-width:600px) {
            .main-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .buy-form {
                width: 100%;
            }

            .btn-cart, .btn-buy {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="product-card">

    {% if product.image %}
        <div class="image-container">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
        </div>
    {% endif %}

    <div class="product-info">

        <h1>{{ product.name }}</h1>
        <div class="brand-subtitle">{{ product.brand }}</div>

        <p class="detail"><strong>Size:</strong> {{ product.size }}</p>
        <p class="detail"><strong>Material:</strong> {{ product.material }}</p>
        <p class="detail"><strong>Color:</strong> {{ product.color }}</p>

        <div class="price">₹{{ product.price }}</div>

        <p class="description">
            {{ product.description }}
        </p>

        <div class="actions-container">
            <div class="main-actions">
                <a href="/add_to_cart/{{product.id}}/" class="btn btn-cart">
                    🛒 Add to Cart
                </a>
                
                <form method="POST" action="/buy_now/{{product.id}}/" class="buy-form">
                    {% csrf_token %}
                    <input type="number" name="quantity" min="1" value="1" aria-label="Quantity">
                    <button type="submit" class="btn btn-buy">
                        ⚡ Buy Now
                    </button>
                </form>
            </div>

            <a href="/add_feedback/{{product.id}}/" class="btn btn-feedback">
                ✍️ Leave Feedback
            </a>
        </div>

    </div>

</div>

</body>
</html>
