<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - New Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            /* Consistent premium clothing boutique background with dark overlay */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        /* Unified Premium Back Button */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            font-size: 14px;
            z-index: 10;
        }

        .back-btn:hover {
            background: white;
            color: #333;
            transform: translateX(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Form Container matching unified boutique aesthetics */
        .container {
            background: rgba(255, 255, 255, 0.96); 
            padding: 40px 35px;
            width: 100%;
            max-width: 600px; /* Wider footprint to cleanly organize fields into 2 columns */
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 25px;
            border-bottom: 2px solid #b5838d; /* Boutique signature color */
            padding-bottom: 12px;
            text-transform: uppercase;
        }

        /* Optimized grid structure for clean garment attribute pairing */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            color: #6d597a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], 
        input[type="number"], 
        textarea {
            width: 100%;
            padding: 11px 14px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fdfbfb;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Interactive Focus Enhancements */
        input:focus, textarea:focus {
            border-color: #b5838d;
            box-shadow: 0 0 0 3px rgba(181, 131, 141, 0.2);
            background: #ffffff;
        }

        input[type="file"] {
            margin-top: 6px;
            font-size: 14px;
            color: #555;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Polished Call-To-Action Button */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #6d597a;
            color: white;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(109, 89, 122, 0.3);
        }

        button[type="submit"]:hover {
            background: #b5838d;
            box-shadow: 0 6px 18px rgba(181, 131, 141, 0.4);
            transform: translateY(-1px);
        }

        /* Dynamic mobile adaptation */
        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<!-- Unified Back Button navigation -->
<a href="javascript:history.back()" class="back-btn">
    &#8592; Back
</a>

<div class="container">
    <h2>New Products</h2>
    
    <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-grid">
            <div class="full-width">
                <label>Name:</label>
                <input type="text" name="name" placeholder="Product Name" required>
            </div>
            
            <div>
                <label>Price:</label>
                <input type="number" name="price" placeholder="Price" required>
            </div>
            
            <div>
                <label>Brand:</label>
                <input type="text" name="brand" placeholder="Brand">
            </div>
            
            <div>
                <label>Size:</label>
                <input type="text" name="size" placeholder="Size">
            </div>
            
            <div>
                <label>Material:</label>
                <input type="text" name="material" placeholder="Material">
            </div>
            
            <div>
                <label>Neckline:</label>
                <input type="text" name="neckline" placeholder="Neckline">
            </div>

            <div>
                <label>Sleeve:</label>
                <input type="text" name="sleeve_length" placeholder="Sleeve">
            </div>

            <div>
                <label>Length:</label>
                <input type="text" name="length" placeholder="Length">
            </div>

            <div>
                <label>Color:</label>
                <input type="text" name="color" placeholder="Color">
            </div>

            <div class="full-width">
                <label>Pattern:</label>
                <input type="text" name="pattern" placeholder="Pattern">
            </div>
            
            <div class="full-width">
                <label>Image:</label>
                <!-- Corrected accept string from "img/*" to standard "image/*" -->
                <input type="file" name="image" accept="image/*">
            </div>

            <div class="full-width">
                <label>Description:</label>
                <!-- Corrected field name from "discription" to matching variable "description" -->
                <textarea name="description" placeholder="Description"></textarea>
            </div>
        </div>
        
        <button type="submit">Add Product</button>
    </form>
</div> 
</body>
</html>
