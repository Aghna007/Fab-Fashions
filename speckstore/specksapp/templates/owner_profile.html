<!DOCTYPE html>
<html>
<head>
    <title>Owner Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            /* Fallback gradient if image fails to load, layered with a dark overlay for text readability */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Elegant Back Button */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .back-btn:hover {
            background: white;
            color: #333;
            transform: translateX(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Glassmorphism Profile Card */
        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }

        .profile-card h2 {
            color: #2c3e50;
            font-size: 26px;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            border-bottom: 2px solid #b5838d; /* Elegant rose-gold/muted tone */
            padding-bottom: 12px;
        }

        /* Avatar Styling */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #b5838d;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .info {
            text-align: left;
            margin-top: 15px;
        }

        /* Polished Info Rows */
        .info p {
            font-size: 16px;
            margin: 14px 0;
            padding: 12px 16px;
            background: #fdfbfb;
            border-left: 4px solid #b5838d;
            border-radius: 4px 8px 8px 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            font-weight: 600;
            color: #6d597a;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            color: #333;
            font-weight: 500;
            text-align: right;
        }
    </style>
</head>

<body>

<a href="/owner_home/" class="back-btn">
     Back
</a>

<div class="profile-card">

    <h2>Owner Profile</h2>

    {% if user.image %}
        <img src="{{ user.image.url }}" class="profile-img" alt="Owner Image">
    {% else %}
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" class="profile-img" alt="Placeholder">
    {% endif %}

    <div class="info">
        <p><span class="label">Name</span> <span class="value">{{ user.name }}</span></p>
        <p><span class="label">Shop Name</span> <span class="value">{{ user.shop_name|default:"Not Provided" }}</span></p>
        <p><span class="label">Email</span> <span class="value">{{ user.email }}</span></p>
        <p><span class="label">Shop Address</span> <span class="value">{{ user.shop_address|default:"Not Provided" }}</span></p>
        <p><span class="label">Place</span> <span class="value">{{ user.place|default:"Not Provided" }}</span></p>
        <p><span class="label">Phone</span> <span class="value">{{ user.phone }}</span></p>
    </div>

</div>

</body>
</html>
