<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Designer Profile</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        /* Elegant, atmospheric high-fashion background to match profile */
        background: linear-gradient(rgba(20, 20, 20, 0.6), rgba(20, 20, 20, 0.6)),
        url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1974&auto=format&fit=crop');
        background-size:cover;
        background-position:center;
        background-attachment: fixed;
        padding:40px 20px;
    }

    .container{
        width:100%;
        max-width:750px;
    }

    .form-box{
        background:rgba(255,255,255,0.98);
        padding:50px 40px 40px 40px;
        border-radius:24px;
        box-shadow:0 20px 40px rgba(0,0,0,0.3);
        position: relative;
    }

    /* Sleek Back Button */
    .back-btn {
        position: absolute;
        top: 25px;
        left: 35px;
        text-decoration: none;
        color: #6c757d;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: color 0.3s ease;
    }

    .back-btn:hover {
        color: #2b2d42;
    }

    .form-box h1{
        text-align:center;
        color:#2b2d42;
        font-size:32px;
        font-weight: 600;
        letter-spacing: -0.5px;
        margin-bottom:35px;
    }

    .form-group{
        margin-bottom:20px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
        color:#8d99ae;
        font-size:12px;
        text-transform:uppercase;
        letter-spacing: 1px;
    }

    input,
    select{
        width:100%;
        padding:14px;
        border:1px solid #e2e8f0;
        border-radius:12px;
        outline:none;
        font-size:15px;
        color:#2b2d42;
        font-weight: 500;
        background:#fdfbfb;
        transition:.3s ease;
    }

    input:focus,
    select:focus{
        border-color:#b5838d;
        background:#fff;
        box-shadow:0 0 0 3px rgba(181, 131, 141, 0.15);
    }

    .btn-group{
        display:flex;
        gap:15px;
        margin-top:35px;
    }

    .save-btn{
        flex:1;
        background:#2b2d42;
        color:white;
        border:none;
        padding:14px;
        border-radius:30px;
        font-size:15px;
        cursor:pointer;
        font-weight:600;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 12px rgba(43, 45, 66, 0.15);
        transition:.3s ease;
    }

    .save-btn:hover{
        background:#b5838d;
        box-shadow: 0 6px 20px rgba(181, 131, 141, 0.3);
    }

    @media(max-width:768px){
        .form-box{
            padding: 45px 25px 30px 25px;
        }

        .back-btn {
            top: 15px;
            left: 20px;
        }

        .btn-group{
            flex-direction:column;
        }
    }
</style>
</head>
<body>

<div class="container">

    <div class="form-box">

        <!-- Back Button -->
        <a href="/designer_home/" class="back-btn">
             Back
        </a>

        <h1>Edit Profile</h1>

        <form method="POST">

    {% csrf_token %}

    <div class="form-group">
        <label>Full Name</label>

        <input
        type="text"
        name="name"
        value="{{ user.name }}"
        pattern="[A-Za-z ]+"
        title="Only letters are allowed."
        required>
    </div>

    <div class="form-group">
        <label>Email Address</label>

        <input
        type="email"
        name="email"
        value="{{ user.email }}"
        readonly>
    </div>

    <div class="form-group">
        <label>Age</label>

        <input
        type="number"
        name="age"
        value="{{ user.age }}"
        min="18"
        max="60"
        required>
    </div>

    <div class="form-group">

        <label>Gender</label>

        <select name="gender" required>

            <option value="Male"
            {% if user.gender == "Male" %}
            selected
            {% endif %}>
            Male
            </option>

            <option value="Female"
            {% if user.gender == "Female" %}
            selected
            {% endif %}>
            Female
            </option>

            <option value="Other"
            {% if user.gender == "Other" %}
            selected
            {% endif %}>
            Other
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Phone Number</label>

        <input
        type="text"
        name="phone"
        value="{{ user.phone }}"
        maxlength="10"
        pattern="[0-9]{10}"
        title="Enter a valid 10 digit phone number."
        required>

    </div>

    <div class="form-group">

        <label>Qualification</label>

        <input
        type="text"
        name="qualification"
        value="{{ user.qualification }}"
        pattern="[A-Za-z .]+"
        title="Only letters are allowed."
        required>

    </div>

    <div class="btn-group">

        <button type="submit" class="save-btn">
            Update Profile
        </button>

    </div>

</form>

    </div>

</div>

</body>
</html>
