<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            /* High-quality atelier / fashion studio image */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1974&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 35px;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #222;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: #444;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        textarea {
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #d4af37; /* Elegant gold focus ring */
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        /* Custom file input styling */
        input[type="file"] {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            padding: 5px 0;
        }

        /* Gender Radio Layout */
        .gender-section {
            margin-bottom: 18px;
        }

        .gender-label-main {
            font-weight: 500;
            font-size: 14px;
            color: #444;
            margin-bottom: 8px;
        }

        .gender-options {
            display: flex;
            gap: 20px;
        }

        .gender-options label {
            display: flex;
            align-items: center;
            font-weight: 400;
            font-size: 14px;
            cursor: pointer;
            margin: 0;
        }

        .gender-options input[type="radio"] {
            margin-right: 6px;
            accent-color: #d4af37; /* Forces radio button to match gold theme */
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #222; /* High-contrast classic black button */
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #d4af37; /* Shifting to rich gold on hover */
            color: #fff;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Register</h2>
        <form action="" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text"
       id="name"
       name="name"
       placeholder="Your full name"
       pattern="[A-Za-z ]+"
       title="Only alphabets are allowed"
       required>
            </div>
            
            <div class="form-group">
                <label for="address">Address</label>
               <textarea
name="address"
id="address"
pattern="[A-Za-z0-9,./# -]+"
title="Enter a valid address"></textarea>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text"
       name="phone"
       maxlength="10"
       pattern="[0-9]{10}"
       title="Enter a valid 10 digit phone number"
       required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Your email address">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
       name="password"
       minlength="8"
       required>
            </div>
            
            <div class="gender-section">
                <div class="gender-label-main">Gender</div>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="M"> Male</label>

<label><input type="radio" name="gender" value="F"> Female</label>

<label><input type="radio" name="gender" value="O"> Others</label>
                </div>
            </div>  
            
            <div class="form-group">
                <label for="image">Profile / Design Image</label>
                <input type="file"
       name="image"
       accept=".jpg,.jpeg,.png">
            </div>
            
            <button type="submit">Create Account</button>
        </form>
    </div> 

</body>
</html>
