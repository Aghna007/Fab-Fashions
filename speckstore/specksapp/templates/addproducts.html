<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1950&q=80');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.container{
    width:100%;
    max-width:600px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#222;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
    outline:none;
    transition:.3s;

}

input:focus,
textarea:focus{

    border-color:#000;

}

textarea{

    resize:vertical;
    min-height:100px;

}

button{

    width:100%;
    margin-top:30px;
    padding:14px;
    background:#111;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#333;

}

</style>

</head>

<body>

<div class="container">

<h2>Add New Product</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<label>Product Name</label>

<input
type="text"
name="name"
placeholder="Enter Product Name"
pattern="[A-Za-z0-9 ]+"
title="Only letters and numbers are allowed."
required>

<label>Price</label>

<input
type="number"
name="price"
placeholder="Enter Price"
min="1"
step="0.01"
required>

<label>Brand</label>

<input
type="text"
name="brand"
placeholder="Enter Brand"
pattern="[A-Za-z0-9 ]+"
title="Only letters and numbers are allowed."
required>

<label>Size</label>

<input
type="text"
name="size"
placeholder="Example : S, M, L, XL"
pattern="[A-Za-z0-9,+ ]+"
title="Enter a valid size."
required>

<label>Material</label>

<input
type="text"
name="material"
placeholder="Example : Cotton"
pattern="[A-Za-z ]+"
title="Only alphabets are allowed."
required>
<label>Neckline</label>

<input
type="text"
name="neckline"
placeholder="Example : Round Neck"
pattern="[A-Za-z ]+"
title="Only alphabets are allowed."
required>

<label>Sleeve Length</label>

<input
type="text"
name="sleeve_length"
placeholder="Example : Full Sleeve"
pattern="[A-Za-z ]+"
title="Only alphabets are allowed."
required>

<label>Length</label>

<input
type="text"
name="length"
placeholder="Example : Knee Length"
pattern="[A-Za-z ]+"
title="Only alphabets are allowed."
required>

<label>Color</label>

<input
type="text"
name="color"
placeholder="Example : Black"
pattern="[A-Za-z ]+"
title="Only alphabets are allowed."
required>

<label>Pattern</label>

<input
type="text"
name="pattern"
placeholder="Example : Floral"
pattern="[A-Za-z ]+"
title="Only alphabets are allowed."
required>

<label>Product Image</label>

<input
type="file"
name="image"
accept=".jpg,.jpeg,.png"
required>

<label>Description</label>

<textarea
name="description"
placeholder="Enter Product Description"
minlength="10"
maxlength="500"
required></textarea>

<button type="submit">
    Add Product
</button>

</form>

</div>

</body>

</html>
