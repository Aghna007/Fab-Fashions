<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Exactly matching your requested premium studio background configuration */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1974&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Frosted Atelier Glass Card Container */
        .profile-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 35px;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        /* Header matching the Registration typographic styling */
        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #222;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* High-fashion Profile Image Frame with Gold Halo Accent */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 30px auto;
            border: 3px solid #222;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.4), 0 8px 20px rgba(0,0,0,0.15);
            display: block;
        }

        /* Info rows layout */
        .info {
            text-align: left;
            margin-bottom: 35px;
        }

        .info p {
            color: #444;
            font-size: 14px;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            letter-spacing: 0.5px;
        }

        .info p:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .label {
            color: #222;
            font-weight: 600;
            min-width: 100px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .value {
            text-align: right;
            word-break: break-word;
            flex: 1;
            color: #555;
            font-weight: 400;
        }

        /* Button Layout Configuration */
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
            cursor: pointer;
        }

        /* Classic Black Button Shifting to Gold Accent */
        .btn-update {
            background: #222;
            color: #fff;
            border: none;
        }

        .btn-update:hover {
            background: #d4af37;
            color: #fff;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* Soft Minimalist Secondary Button */
        .btn-back {
            background: rgba(0, 0, 0, 0.05);
            color: #222;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        .btn-back:hover {
            background: rgba(0, 0, 0, 0.1);
            border-color: #222;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2>Profile</h2>

        {% if user.image %}
            <img src="{{ user.image.url }}" class="profile-img" alt="Profile Picture">
        {% endif %}

        <div class="info">
            <p><span class="label">Name</span> <span class="value">{{ user.name }}</span></p>
            <p><span class="label">Email</span> <span class="value">{{ user.email }}</span></p>
            <p><span class="label">Address</span> <span class="value">{{ user.address }}</span></p>
            <p><span class="label">Gender</span> <span class="value">{{ user.gender }}</span></p>
            <p><span class="label">Phone</span> <span class="value">{{ user.phone }}</span></p>
        </div>

        <div class="btn-container">
            <a href="/home/" class="btn btn-back">Back</a>
            <a href="{% url 'editprofile' %}" class="btn btn-update">Update</a>
        </div>
    </div>

</body>
</html>
