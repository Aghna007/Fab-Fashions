<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            /* Premium dress designing atelier background image */
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1974&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 35px;
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #111;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: #333;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        textarea {
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #d4af37; /* Luxe gold accent highlight */
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.35);
        }

        input[type="file"] {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            padding: 5px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #111; /* Classic bold black button */
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #d4af37; /* Transitions to elegant gold on hover */
            color: #fff;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Owner Registration</h2>
        
        <form action="" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Owner Name</label>
                <input
type="text"
name="name"
pattern="[A-Za-z ]+"
title="Only letters are allowed"
required>
            </div>

            <div class="form-group">
                <label for="shop_name">Shop Name</label>
                <input
type="text"
name="shop_name"
pattern="[A-Za-z0-9 ]+"
title="Only letters and numbers are allowed"
required>
            </div>
            
            <div class="form-group">
                <label for="address">Shop Address</label>
                <textarea
    id="shop_address"
    name="shop_address"
    rows="2"
    placeholder="Enter your complete shop address"
    required>
</textarea>
            </div>

            <div class="form-group">
                <label for="place">Place / City</label>
                <input
type="text"
name="place"
pattern="[A-Za-z ]+"
title="Only letters are allowed"
required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
type="text"
name="phone"
maxlength="10"
pattern="[0-9]{10}"
title="Enter a 10 digit phone number"
required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
type="email"
name="email"
required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input
type="password"
name="password"
minlength="8"
required>
            </div>
            
            <div class="form-group">
                <label for="license_image">License Image</label>
            <input
type="file"
name="image"
accept=".jpg,.jpeg,.png"
required>
            </div>
            
            <button type="submit">Submit Registration</button>
        </form>
    </div> 

</body>
</html>
