```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            padding:40px 20px;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .heading{
            text-align:center;
            color:white;
            font-size:40px;
            margin-bottom:35px;
            font-weight:600;
        }

        .wishlist-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:25px;
        }

        .card{
            background:#fff;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 8px 25px rgba(0,0,0,0.15);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .card img{
            width:100%;
            height:320px;
            object-fit:cover;
        }

        .content{
            padding:20px;
        }

        .product-name{
            font-size:22px;
            font-weight:600;
            color:#333;
            margin-bottom:10px;
        }

        .price{
            color:#764ba2;
            font-size:24px;
            font-weight:bold;
            margin-bottom:18px;
        }

        .btn-group{
            display:flex;
            gap:10px;
        }

        .btn{
            flex:1;
            text-align:center;
            text-decoration:none;
            padding:12px;
            border-radius:8px;
            color:white;
            font-weight:500;
            transition:.3s;
        }

        .view-btn{
            background:#667eea;
        }

        .view-btn:hover{
            background:#4f63d2;
        }

        .remove-btn{
            background:#ff4d4d;
        }

        .remove-btn:hover{
            background:#e53935;
        }

        .empty{
            text-align:center;
            color:white;
            font-size:28px;
            margin-top:100px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1 class="heading">❤️ My Wishlist</h1>

    {% if wishlist_items %}
    <div class="wishlist-grid">

        {% for item in wishlist_items %}
        <div class="card">

            <img src="{{ item.products.image.url }}" alt="{{ item.products.name }}">

            <div class="content">

                <h3 class="product-name">
                    {{ item.products.name }}
                </h3>

                <p class="price">
                    ₹{{ item.products.price }}
                </p>

                <div class="btn-group">

                    <a href="{% url 'product_details' item.products.id %}" class="btn view-btn">
                        View Product
                    </a>

                    <a href="{% url 'remove_wishlist' item.id %}" class="btn remove-btn">
                        Remove
                    </a>

                </div>

            </div>

        </div>
        {% endfor %}

    </div>

    {% else %}

    <div class="empty">
        ❤️ Your wishlist is empty
    </div>

    {% endif %}

</div>

</body>
</html>
```
