<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Profile</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            /* Elegant, atmospheric high-fashion background */
            background: linear-gradient(rgba(20, 20, 20, 0.6), rgba(20, 20, 20, 0.6)),
            url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1974&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
            background-attachment: fixed;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .profile-card{
            width:100%;
            max-width:750px;
            background:rgba(255, 255, 255, 0.98);
            border-radius:24px;
            padding:50px 40px 40px 40px;
            box-shadow:0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        /* Sleek Back Button */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 35px;
            text-decoration: none;
            color: #6c757d;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #2b2d42;
        }

        .profile-header{
            text-align:center;
            margin-bottom:40px;
        }

        .profile-img{
            width:130px;
            height:130px;
            border-radius:50%;
            /* Sophisticated Rose Gold accent border */
            border:4px solid #b5838d;
            object-fit:cover;
            margin-bottom:15px;
            box-shadow: 0 8px 16px rgba(181, 131, 141, 0.2);
        }

        .profile-header h1{
            color:#2b2d42;
            font-size:32px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .profile-header p{
            color:#b5838d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-top:5px;
        }

        .profile-details{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:24px;
        }

        .detail-box{
            background:#fdfbfb;
            padding:20px;
            border-radius:12px;
            border-left:3px solid #b5838d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .detail-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .detail-box h3{
            color:#8d99ae;
            font-size:12px;
            margin-bottom:6px;
            text-transform:uppercase;
            letter-spacing: 1px;
        }

        .detail-box p{
            color:#2b2d42;
            font-size:16px;
            font-weight:500;
        }

        .btn-section{
            text-align:center;
            margin-top:40px;
        }

        /* Combined elegant button styles */
        .edit-btn{
            text-decoration:none;
            background:#2b2d42;
            color:white;
            padding:14px 40px;
            border-radius:30px;
            font-size:15px;
            font-weight:600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(43, 45, 66, 0.15);
        }

        .edit-btn:hover{
            background:#b5838d;
            transform:translateY(-2px);
            box-shadow: 0 6px 20px rgba(181, 131, 141, 0.3);
        }

        @media(max-width:768px){
            .profile-card {
                padding: 45px 25px 30px 25px;
            }
            .profile-details{
                grid-template-columns:1fr;
                gap: 15px;
            }
            .back-btn {
                top: 15px;
                left: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        
        <a href="/designer_home/" class="back-btn">
             Back
        </a>

        <div class="profile-header">
            {% if user.image %}
                <img src="{{ user.image.url }}" class="profile-img" alt="Profile">
            {% else %}
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                     class="profile-img" alt="Profile">
            {% endif %}

            <h1>{{ user.name }}</h1>
            <p>Fashion Designer</p>
        </div>

        <div class="profile-details">

            <div class="detail-box">
                <h3>Name</h3>
                <p>{{ user.name }}</p>
            </div>

            <div class="detail-box">
                <h3>Age</h3>
                <p>{{ user.age }}</p>
            </div>

            <div class="detail-box">
                <h3>Qualification</h3>
                <p>{{ user.qualification }}</p>
            </div>

            <div class="detail-box">
                <h3>Gender</h3>
                <p>{{ user.gender }}</p>
            </div>

            <div class="detail-box">
                <h3>Email</h3>
                <p>{{ user.email }}</p>
            </div>

            <div class="detail-box">
                <h3>Phone</h3>
                <p>{{ user.phone }}</p>
            </div>

        </div>

        <div class="btn-section">
            <a href="/designer_editprofile/" class="edit-btn">
                Edit Profile
            </a>
        </div>

    </div>

</body>
</html>
